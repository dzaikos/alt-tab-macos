name: Sync fork
on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.SYNC }}
      - run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git remote add upstream https://github.com/lwouis/alt-tab-macos.git
          git fetch upstream master --tags --force
          git reset --hard upstream/master
          git checkout origin/fork_dz_workflows -- .github/workflows
          git add .github/workflows/ci_cd_fork_dz_sync.yml .github/workflows/ci_cd_fork_dz.yml
          git commit -m "chore: Add fork workflows"
          git push origin master +refs/tags/*:refs/tags/* --atomic --force
